plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Naming/MethodParameterName:
  AllowedNames: [s3, io, id, to, by, on, in, at, ip, db]

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 25

# Keyword arguments are not the parameter list smell this cop is about.
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/ClassLength:
  Max: 150

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 5
